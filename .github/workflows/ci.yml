name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  header-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify single header is up to date
        run: |
          python3 tools/build_single_header.py
          git diff --exit-code include/clap.hpp \
            || { echo "::error::include/clap.hpp is stale — rerun tools/build_single_header.py and commit"; exit 1; }

  build-test:
    # For a header-only library the compiler is the platform: everything is
    # templates compiled in the user's TU, so each toolchain is its own check.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cxx: g++
          - name: linux-clang
            os: ubuntu-latest
            cxx: clang++
          - name: macos-appleclang
            os: macos-latest
            cxx: clang++
          - name: windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ clang libgtest-dev

      # The one locale test skips itself where fr_FR.UTF-8 is missing, so only
      # Linux bothers generating it.
      - name: Generate fr_FR locale
        if: runner.os == 'Linux'
        run: sudo locale-gen fr_FR.UTF-8 && sudo update-locale

      # macOS and Windows have no packaged GTest; CMake fetches it there.
      - name: Configure
        run: cmake -S . -B build ${{ matrix.cxx && format('-DCMAKE_CXX_COMPILER={0}', matrix.cxx) || '' }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: linux-clang-asan-ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang

      - name: Configure
        run: >
          cmake -S. -Bbuild
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build --output-on-failure